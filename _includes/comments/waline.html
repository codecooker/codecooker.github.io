/>

</style>
<div id="waline"></div>
<script type="module">

  init({

    serverURL: 'https://comment.codecooker.cn',
    dark: 'html[data-mode="dark"]',

      '//unpkg.com/@waline/emojis@1.3.0/weibo',
      '//unpkg.com/@waline/emojis@1.3.0/bilibili'

    requiredMeta: ['nick'],

    }
  });
